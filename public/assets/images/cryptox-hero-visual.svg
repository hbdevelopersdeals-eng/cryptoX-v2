  <rect x="20" y="66" width="210" height="434" fill="#101217" />
  <line x1="230" y1="66" x2="230" y2="500" stroke="#1F232B" strokeWidth="1" />

  <!-- Sidebar Items -->
  <!-- BTC Item (Active) -->
  <rect x="30" y="80" width="190" height="54" rx="10" fill="#1D212A" stroke="#FFC105" strokeWidth="1" strokeOpacity="0.5" />
  <circle cx="54" cy="107" r="14" fill="#F7931A" />
  <text x="54" y="112" fill="#FFFFFF" fontFamily="sans-serif" fontSize="13" fontWeight="bold" textAnchor="middle">₿</text>
  <text x="76" y="102" fill="#FFFFFF" fontFamily="system-ui, sans-serif" fontSize="13" fontWeight="bold">Bitcoin</text>
  <text x="76" y="118" fill="#8A93A5" fontFamily="system-ui, sans-serif" fontSize="11">BTC · $96,420</text>
  <text x="208" y="106" fill="#34D399" fontFamily="monospace" fontSize="11" fontWeight="bold" textAnchor="end">+3.48%</text>

  <!-- ETH Item -->
  <rect x="30" y="142" width="190" height="50" rx="10" fill="#14171E" />
  <circle cx="54" cy="167" r="14" fill="#627EEA" />
  <text x="54" y="172" fill="#FFFFFF" fontFamily="sans-serif" fontSize="12" fontWeight="bold" textAnchor="middle">Ξ</text>
  <text x="76" y="162" fill="#D6D9DE" fontFamily="system-ui, sans-serif" fontSize="12" fontWeight="600">Ethereum</text>
  <text x="76" y="178" fill="#8A93A5" fontFamily="system-ui, sans-serif" fontSize="10">ETH · $3,410</text>
  <text x="208" y="166" fill="#34D399" fontFamily="monospace" fontSize="11" textAnchor="end">+1.82%</text>

