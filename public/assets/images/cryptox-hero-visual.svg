<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#12151B" stopOpacity="0.95" />
      <stop offset="100%" stopColor="#0B0D11" stopOpacity="0.98" />
    </linearGradient>
    <linearGradient id="accent-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFE066" />
      <stop offset="100%" stopColor="#FFC105" />
    </linearGradient>
    <linearGradient id="chart-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#34D399" stopOpacity="0.35" />
      <stop offset="100%" stopColor="#34D399" stopOpacity="0.0" />
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#343B48" />
      <stop offset="50%" stopColor="#1F232B" />
      <stop offset="100%" stopColor="#FFC105" stopOpacity="0.3" />
    </linearGradient>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Ambient Glows -->
  <circle cx="680" cy="120" r="140" fill="#FFC105" fillOpacity="0.06" filter="url(#glow-gold)" />
  <circle cx="120" cy="400" r="160" fill="#34D399" fillOpacity="0.04" filter="url(#glow-gold)" />

  <!-- Main Terminal Window Frame -->
  <rect x="20" y="20" width="760" height="480" rx="20" fill="url(#bg-grad)" stroke="url(#card-border)" strokeWidth="1.5" />

  <!-- Terminal Header Bar -->
  <rect x="20" y="20" width="760" height="46" rx="20" fill="#161920" />
  <rect x="20" y="46" width="760" height="20" fill="#161920" />
  <line x1="20" y1="66" x2="780" y2="66" stroke="#232730" strokeWidth="1" />

  <!-- Mac style dots -->
  <circle cx="44" cy="43" r="5" fill="#EF4444" />
  <circle cx="60" cy="43" r="5" fill="#F59E0B" />
  <circle cx="76" cy="43" r="5" fill="#10B981" />

  <!-- Terminal Tab Header -->
  <rect x="105" y="31" width="160" height="26" rx="6" fill="#0D0E12" stroke="#252A34" strokeWidth="1" />
  <circle cx="120" cy="44" r="3.5" fill="#FFC105" />
  <text x="132" y="48" fill="#F0F2F5" fontFamily="system-ui, sans-serif" fontSize="11" fontWeight="600">BTC/USDT · Live Pro</text>

