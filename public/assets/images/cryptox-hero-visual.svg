  <line x1="440" y1="170" x2="440" y2="225" stroke="#34D399" strokeWidth="1.5" />
  <rect x="434" y="175" width="12" height="36" fill="#34D399" rx="2" />
  <!-- Candle 6 -->
  <line x1="480" y1="160" x2="480" y2="210" stroke="#F87171" strokeWidth="1.5" />
  <rect x="474" y="170" width="12" height="18" fill="#F87171" rx="2" />
  <!-- Candle 7 -->
  <line x1="520" y1="145" x2="520" y2="195" stroke="#34D399" strokeWidth="1.5" />
  <rect x="514" y="150" width="12" height="32" fill="#34D399" rx="2" />
  <!-- Candle 8 -->
  <line x1="560" y1="130" x2="560" y2="180" stroke="#34D399" strokeWidth="1.5" />
  <rect x="554" y="135" width="12" height="35" fill="#34D399" rx="2" />
  <!-- Candle 9 -->
  <line x1="600" y1="115" x2="600" y2="165" stroke="#34D399" strokeWidth="1.5" />
  <rect x="594" y="120" width="12" height="30" fill="#34D399" rx="2" />
  <!-- Candle 10 (High Peak) -->
  <line x1="640" y1="95" x2="640" y2="150" stroke="#34D399" strokeWidth="1.5" />
  <rect x="634" y="100" width="12" height="35" fill="#34D399" rx="2" />
  <!-- Candle 11 -->
  <line x1="680" y1="105" x2="680" y2="145" stroke="#F87171" strokeWidth="1.5" />
  <rect x="674" y="110" width="12" height="20" fill="#F87171" rx="2" />
  <!-- Candle 12 (Current) -->
  <line x1="720" y1="90" x2="720" y2="135" stroke="#34D399" strokeWidth="1.5" />
  <rect x="714" y="95" width="12" height="25" fill="#34D399" rx="2" />

  <!-- Moving Average Trend Curve Line -->
  <path d="M250 280 Q 300 290 350 240 T 450 210 T 550 180 T 650 140 T 760 110" stroke="#FFC105" strokeWidth="3" fill="none" />

  <!-- Floating Strategy Engine Signal Badge -->
  <g transform="translate(480, 240)">
    <rect width="250" height="74" rx="12" fill="#12161F" stroke="#FFC105" strokeWidth="1.25" />
    <circle cx="24" cy="24" r="8" fill="#FFC105" fillOpacity="0.2" />
    <circle cx="24" cy="24" r="4" fill="#FFC105" />
    <text x="40" y="28" fill="#F0F2F5" fontFamily="system-ui, sans-serif" fontSize="12" fontWeight="bold">RSI-14 Strategy Signal</text>
    <rect x="186" y="16" width="50" height="18" rx="4" fill="#34D399" fillOpacity="0.2" />
    <text x="211" y="29" fill="#34D399" fontFamily="monospace" fontSize="10" fontWeight="bold" textAnchor="middle">BUY @ 28</text>
    <text x="18" y="56" fill="#8A93A5" fontFamily="system-ui, sans-serif" fontSize="10">Simulated fill · Next-bar fee 0.075%</text>
  </g>

  <!-- Bottom Indicators Pane -->
  <rect x="250" y="380" width="510" height="100" rx="10" fill="#12141A" stroke="#1F232B" strokeWidth="1" />
  <text x="265" y="402" fill="#8A93A5" fontFamily="monospace" fontSize="10" fontWeight="bold">RSI (14) · VALUE: 34.2 (OVERSOLD ACCUMULATION)</text>
  <line x1="265" y1="440" x2="745" y2="440" stroke="#252A34" strokeWidth="1" strokeDasharray="3 3" />
  <path d="M265 460 Q 320 470 380 430 T 480 410 T 580 440 T 680 425 T 745 405" stroke="#60A5FA" strokeWidth="2" fill="none" />
</svg>
