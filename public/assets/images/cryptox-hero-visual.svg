  <text x="208" y="224" fill="#34D399" fontFamily="monospace" fontSize="11" textAnchor="end">+6.14%</text>

  <!-- Main Chart Area -->
  <!-- Top Metrics Bar -->
  <g transform="translate(250, 80)">
    <text x="0" y="16" fill="#8A93A5" fontFamily="system-ui, sans-serif" fontSize="11" fontWeight="500">INDEX PRICE</text>
    <text x="0" y="40" fill="#F0F2F5" fontFamily="monospace" fontSize="22" fontWeight="bold">$96,420.50</text>
    
    <text x="160" y="16" fill="#8A93A5" fontFamily="system-ui, sans-serif" fontSize="11" fontWeight="500">24H HIGH</text>
    <text x="160" y="38" fill="#F0F2F5" fontFamily="monospace" fontSize="14" fontWeight="600">$97,850.00</text>

    <text x="270" y="16" fill="#8A93A5" fontFamily="system-ui, sans-serif" fontSize="11" fontWeight="500">24H LOW</text>
    <text x="270" y="38" fill="#F0F2F5" fontFamily="monospace" fontSize="14" fontWeight="600">$93,210.00</text>

    <text x="380" y="16" fill="#8A93A5" fontFamily="system-ui, sans-serif" fontSize="11" fontWeight="500">PROVENANCE</text>
    <rect x="380" y="24" width="115" height="18" rx="4" fill="#FFC105" fillOpacity="0.15" />
    <text x="437" y="37" fill="#FFC105" fontFamily="monospace" fontSize="10" fontWeight="bold" textAnchor="middle">CoinGecko + CEX</text>
  </g>

  <!-- Grid lines -->
  <line x1="250" y1="150" x2="760" y2="150" stroke="#1C2027" strokeWidth="1" strokeDasharray="4 4" />
  <line x1="250" y1="210" x2="760" y2="210" stroke="#1C2027" strokeWidth="1" strokeDasharray="4 4" />
  <line x1="250" y1="270" x2="760" y2="270" stroke="#1C2027" strokeWidth="1" strokeDasharray="4 4" />
  <line x1="250" y1="330" x2="760" y2="330" stroke="#1C2027" strokeWidth="1" strokeDasharray="4 4" />

  <!-- Dynamic Price Area Fill -->
  <path d="M250 280 Q 300 290 350 240 T 450 210 T 550 180 T 650 140 T 760 110 L 760 360 L 250 360 Z" fill="url(#chart-green)" />
  
  <!-- Candlestick chart simulation -->
  <!-- Candle 1 -->
  <line x1="280" y1="260" x2="280" y2="300" stroke="#34D399" strokeWidth="1.5" />
  <rect x="274" y="270" width="12" height="20" fill="#34D399" rx="2" />
  <!-- Candle 2 -->
  <line x1="320" y1="240" x2="320" y2="290" stroke="#F87171" strokeWidth="1.5" />
