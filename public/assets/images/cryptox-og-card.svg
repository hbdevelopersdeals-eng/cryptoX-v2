<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B0D11" />
      <stop offset="50%" stopColor="#0F1217" />
      <stop offset="100%" stopColor="#08090C" />
    </linearGradient>
    <linearGradient id="og-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFE066" />
      <stop offset="50%" stopColor="#FFC105" />
      <stop offset="100%" stopColor="#E59400" />
    </linearGradient>
    <linearGradient id="og-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#181C24" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#101319" stopOpacity="0.9" />
    </linearGradient>
    <filter id="og-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#og-bg)" />

  <!-- Ambient Golden and Emerald Glows -->
  <circle cx="1000" cy="150" r="280" fill="#FFC105" fillOpacity="0.08" filter="url(#og-glow)" />
  <circle cx="200" cy="500" r="240" fill="#34D399" fillOpacity="0.05" filter="url(#og-glow)" />

  <!-- Cyber Grid Pattern Overlay -->
  <g opacity="0.12" stroke="#374151" strokeWidth="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left Content Column -->
  <g transform="translate(80, 80)">
    <!-- Brand Mark & Logo -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="60" height="60" rx="16" fill="#151820" stroke="url(#og-gold)" strokeWidth="2" />
      <circle cx="30" cy="30" r="22" stroke="#252A34" strokeWidth="1" strokeDasharray="3 3" />
      <path d="M18 17L42 43M42 17L18 43" stroke="url(#og-gold)" strokeWidth="4.5" strokeLinecap="round" />
      <circle cx="30" cy="30" r="4.5" fill="#09090C" stroke="#FFE066" strokeWidth="2" />
      <circle cx="30" cy="30" r="2" fill="#FFC105" />

      <text x="75" y="42" fill="#FFFFFF" fontFamily="system-ui, sans-serif" fontSize="36" fontWeight="bold">Crypto<tspan fill="#FFC105">X</tspan></text>
      <rect x="235" y="16" width="95" height="26" rx="6" fill="#FFC105" fillOpacity="0.15" stroke="#FFC105" strokeWidth="1" strokeOpacity="0.3" />
      <text x="282" y="34" fill="#FFC105" fontFamily="monospace" fontSize="13" fontWeight="bold" textAnchor="middle">TERMINAL</text>
    </g>

    <!-- Headline -->
    <text x="0" y="145" fill="#F0F2F5" fontFamily="system-ui, sans-serif" fontSize="48" fontWeight="800" letterSpacing="-1">
      Real-Time Market Terminal
    </text>
    <text x="0" y="195" fill="#FFE066" fontFamily="system-ui, sans-serif" fontSize="38" fontWeight="700">
      &amp; Strategy Engine
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="260" fill="#8A93A5" fontFamily="system-ui, sans-serif" fontSize="20" fontWeight="400">
      Multi-venue CoinGecko REST &amp; Binance WebSocket feeds,
    </text>
    <text x="0" y="290" fill="#8A93A5" fontFamily="system-ui, sans-serif" fontSize="20" fontWeight="400">
      FIFO cost-basis portfolio, 10x backtested strategy presets,
    </text>
    <text x="0" y="320" fill="#8A93A5" fontFamily="system-ui, sans-serif" fontSize="20" fontWeight="400">
      and zero-custody read-only wallet safety.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 380)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="42" rx="10" fill="#161A22" stroke="#252A36" strokeWidth="1.5" />
      <circle cx="20" cy="21" r="5" fill="#34D399" />
      <text x="35" y="26" fill="#F0F2F5" fontFamily="system-ui, sans-serif" fontSize="14" fontWeight="600">LIVE FEED WS</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="180" height="42" rx="10" fill="#161A22" stroke="#252A36" strokeWidth="1.5" />
      <circle cx="195" cy="21" r="5" fill="#FFC105" />
      <text x="210" y="26" fill="#F0F2F5" fontFamily="system-ui, sans-serif" fontSize="14" fontWeight="600">10x STRATEGIES</text>

      <!-- Pill 3 -->
      <rect x="370" y="0" width="165" height="42" rx="10" fill="#161A22" stroke="#252A36" strokeWidth="1.5" />
      <circle cx="390" cy="21" r="5" fill="#60A5FA" />
      <text x="405" y="26" fill="#F0F2F5" fontFamily="system-ui, sans-serif" fontSize="14" fontWeight="600">PAPER TRADER</text>
    </g>
  </g>

  <!-- Right Visual Card (Floating Mockup) -->
  <g transform="translate(680, 75)">
    <rect width="450" height="470" rx="18" fill="url(#og-card)" stroke="#2B313E" strokeWidth="1.5" />
    <rect width="450" height="40" rx="18" fill="#151921" />
    <circle cx="25" cy="20" r="4.5" fill="#EF4444" />
    <circle cx="40" cy="20" r="4.5" fill="#F59E0B" />
    <circle cx="55" cy="20" r="4.5" fill="#10B981" />
    <text x="80" y="25" fill="#8A93A5" fontFamily="monospace" fontSize="11" fontWeight="600">BTC/USDT · 1s FEED</text>

    <!-- Mini Live Stats -->
    <g transform="translate(25, 60)">
      <text x="0" y="16" fill="#8A93A5" fontFamily="sans-serif" fontSize="11">PRICE</text>
      <text x="0" y="42" fill="#F0F2F5" fontFamily="monospace" fontSize="24" fontWeight="bold">$96,420</text>
      <rect x="150" y="20" width="70" height="24" rx="6" fill="#34D399" fillOpacity="0.2" />
      <text x="185" y="36" fill="#34D399" fontFamily="monospace" fontSize="12" fontWeight="bold" textAnchor="middle">+4.82%</text>
    </g>

    <!-- Candlestick Graphic in card -->
    <g transform="translate(25, 130)">
      <line x1="0" y1="120" x2="400" y2="120" stroke="#202530" strokeWidth="1" strokeDasharray="3 3" />
      <line x1="0" y1="60" x2="400" y2="60" stroke="#202530" strokeWidth="1" strokeDasharray="3 3" />

      <!-- Sparkline curve -->
      <path d="M10 160 Q 60 170 110 120 T 210 100 T 310 60 T 390 20" stroke="#FFC105" strokeWidth="3" fill="none" />
      
      <!-- Mini Candles -->
      <rect x="40" y="130" width="14" height="30" fill="#34D399" rx="2" />
      <rect x="80" y="110" width="14" height="25" fill="#F87171" rx="2" />
      <rect x="120" y="80" width="14" height="40" fill="#34D399" rx="2" />
      <rect x="160" y="65" width="14" height="35" fill="#34D399" rx="2" />
      <rect x="200" y="85" width="14" height="20" fill="#F87171" rx="2" />
      <rect x="240" y="50" width="14" height="45" fill="#34D399" rx="2" />
      <rect x="280" y="35" width="14" height="40" fill="#34D399" rx="2" />
      <rect x="320" y="45" width="14" height="25" fill="#F87171" rx="2" />
      <rect x="360" y="15" width="14" height="45" fill="#34D399" rx="2" />
    </g>

    <!-- Strategy Signal Alert Box -->
    <g transform="translate(25, 340)">
      <rect width="400" height="90" rx="12" fill="#131720" stroke="#FFC105" strokeWidth="1" strokeOpacity="0.6" />
      <circle cx="25" cy="28" r="8" fill="#FFC105" fillOpacity="0.2" />
      <circle cx="25" cy="28" r="4" fill="#FFC105" />
      <text x="44" y="32" fill="#F0F2F5" fontFamily="system-ui, sans-serif" fontSize="13" fontWeight="bold">Backtested Strategy: Golden Cross (MA20/50)</text>
      <text x="44" y="54" fill="#8A93A5" fontFamily="system-ui, sans-serif" fontSize="11">Sharpe: 2.14 · Max Drawdown: 8.4% · Win Rate: 68.2%</text>
      <text x="44" y="74" fill="#34D399" fontFamily="monospace" fontSize="11" fontWeight="bold">STATUS: HONEST BACKTEST PASSED (1,892 test points)</text>
    </g>
  </g>
</svg>
